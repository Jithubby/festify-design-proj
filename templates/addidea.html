<!DOCTYPE html>
<html>
<head>
    <title>Festify - Share Your Decor Idea</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- navigation bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">🎨 Festify</a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/decor">Gallery</a>
                <a href="/add-idea">Add Idea</a>
                <a href="/order">Order Now</a>
                <a href="/login">Admin</a>
            </div>
        </div>
    </nav>

    <!-- main content -->
    <div class="container">
        <h1 class="page-title">Share Your Decor Idea</h1>
        <p class="subtitle">Submit your decor suggestion and inspire the community</p>

        <!-- error messages -->
        {% if error %}
        <div class="error-message">⚠️ {{ error }}</div>
        {% endif %}

        <!-- add decor form -->
        <form action="/add" method="POST" class="order-form">
            <div class="form-section">
                <h2>Decor Details</h2>
                
                <label>Decor Name</label>
                <input type="text" name="decor_name" placeholder="e.g. Rustic Wedding Centerpiece" required>
                
                <label>Event Type</label>
                <input type="text" name="event_type" placeholder="e.g. Wedding, Birthday, Corporate" required>
                
                <label>Color Scheme</label>
                <input type="text" name="color_scheme" placeholder="e.g. Blush Pink & Gold" required>
                
                <label>Description</label>
                <textarea name="description" placeholder="Describe the decor idea in detail..." required></textarea>
                
                <label>Price Range ($)</label>
                <input type="number" name="price" placeholder="e.g. 150" step="0.01" required>
            </div>

            <button type="submit" class="btn btn-primary btn-large">Submit Your Idea</button>
        </form>
    </div>

    <!-- footer -->
    <footer>
        <p>&copy; 2024 Festify - Custom Event Decor. All rights reserved.</p>
    </footer>
</body>
</html>
